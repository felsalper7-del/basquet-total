.cancha {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
  min-height: 0;
  height: 480px;
  aspect-ratio: auto;
  padding: 12px;
  box-sizing: border-box;
  overflow: hidden;
  border: 3px solid #f5d5a0;
  border-radius: 5px;
  background-color: #c58a52;

      transparent calc(50% - 1px),
      rgba(255, 255, 255, .85) calc(50% - 1px),
      rgba(255, 255, 255, .85) calc(50% + 1px),
      transparent calc(50% + 1px)

    );
  color: white;
}

    function escapar(texto) {
      return String(texto ?? "").replace(/[&<>"']/g, caracter => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[caracter]);

    function tablaEstadisticas(equipo, titulo) {
      if (!equipo) return "";

      const filas = [
        ["Puntos", equipo.pts],

        ["Porcentaje de campo", `${equipo.fg_pct ?? 0}%`],
        ["Triples", `${equipo.tpm ?? 0}/${equipo.tpa ?? 0}`],

        ["Rebotes", equipo.reb],
        ["Asistencias", equipo.ast],
        ["Robos", equipo.stl],
        ["Tapones", equipo.blk],
        ["Pérdidas", equipo.tov],
        ["Puntos en la pintura", equipo.pts_paint],

      ];

          <table class="tabla-ficha">
            <thead><tr><th>Estadística</th><th>Total</th></tr></thead>
            <tbody>

                  <td>${escapar(valor ?? 0)}</td>

            </tbody>
          </table>
